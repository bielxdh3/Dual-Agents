# Copy to config.toml and adjust paths. Account names are local stable keys;
# labels are display-only and are never used to identify a login.

[orchestrator]
repository = "C:/Projects/Dual-Codex"
runs_dir = "runs"
max_correction_cycles = 1
require_clean_git = true
fallback_enabled = false
codex_command = "codex"
antigravity_command = "C:/Users/USER/AppData/Local/agy/bin/agy.exe"
node_command = "node"
terminal_readiness_timeout = 60
terminal_turn_start_timeout = 15
# Native TUI live attach retains bounded output and reports behind cursors.
# `delegate --reuse-existing` is strict and never starts or changes a TUI.
app_server_initialize_timeout = 30
app_server_thread_timeout = 30
app_server_turn_start_timeout = 30
app_server_turn_timeout = 600
dashboard_telemetry_timeout = 5
live_event_journal_max_records = 2000
live_event_journal_max_record_bytes = 65536
live_event_journal_max_detail_bytes = 16384

[accounts.primary]
label = "Primary account"
codex_home = "C:/Users/USER/CodexProfiles/architect"
model = ""
reasoning_effort = "high"
service_tier = ""
backend = "windows"
network_access = false

[accounts.executor]
label = "Antigravity / Gemini Executor"
codex_home = "C:/Users/USER/CodexProfiles/executor"
model = "gemini-3.8-flash"
reasoning_effort = "medium"
service_tier = ""
backend = "antigravity"
network_access = false
# The dashboard normalizes agy slugs such as -low/-medium/-high into one model.
# Fixed runtime modes (for example Thinking) remain read-only in the UI.

[accounts.codex-secondary]
label = "Codex Secondary Architect / Reviewer"
codex_home = "C:/Users/USER/CodexProfiles/secondary"
model = "gpt-5.6-luna"
reasoning_effort = "max"
service_tier = ""
backend = "app_server"
network_access = false
fallback_roles = ["executor"]

# API profiles use an environment-variable reference; never put the key here.
# [accounts.api]
# label = "OpenAI-compatible API"
