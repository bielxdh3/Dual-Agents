# base_url = "https://api.example.invalid/v1"
# available_models = ["model-id"]
# supported_reasoning_efforts = []
# model = "model-id"
# reasoning_effort = ""

[roles]
orchestrator = "primary"
architect = "codex-secondary"
reviewer = "codex-secondary"
executor = "executor"
